[plugin_settings."noctalia/timer"]
panel_placement = "floating"

[plugin_settings."nomadcxx/gamer-mode"]
main_open_near_click = true

[plugin_settings."weinguyen/procmon"]
panel_position = "auto"

[plugins]
enabled = ["icefish/phone-operate", "noctalia/kaomoji", "noctalia/timer", "noctalia/notes", "yugaaank/better-clock", "aristides/udiskie", "weinguyen/procmon", "decksters-lab/palette-creator", "kenn/keybind-cheatsheet", "nightwatch75/file-search", "yocraft/custom-shortcut", "gustav0ar/drive-health", "jrohland/claudecode", "nomadcxx/gamer-mode", "dotnetrob/cat", "noctalia/bongocat", "jkyon/portage-updates"]

[[plugins.source]]
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
kind = "path"
location = "/home/jkyon/.dotfiles/config/noctalia/plugins"
name = "jkyon-local"

[shell]
app_icon_color = "primary"
avatar_path = "/home/jkyon/Pictures/ToOrganize/profile_pic.jpeg"
lang = "en"
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.launcher]
app_grid = true

[shell.launcher.providers.calculator]
global = true
prefix = "calc"

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
global = false
prefix = "session"

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.panel]
clipboard_position = "auto"
control_center_placement = "floating"
open_near_click_clipboard = true
open_near_click_control_center = true
open_near_click_session = true

[shell.screenshot]
confirm_region = true
pipe_command = "satty --filename -"
pipe_to_command = true
remember_last_region = true
save_to_file = false
show_cursor = true

[shell.session]
grid = true
grid_columns = 5

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 3.0
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "logout"
enabled = false
shortcut = "2"

[[shell.session.actions]]
action = "lock_and_suspend"
enabled = false
shortcut = "3"

[[shell.session.actions]]
action = "lock"
enabled = false
shortcut = "1"

[system.monitor]
cpu_temp_critical_threshold = 80

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Mauve"
source = "community"
wallpaper_scheme = "dysfunctional"

[wallpaper]
fill_mode = "center"
transition = ["honeycomb"]
transition_on_startup = true

[wallpaper.automation]
recursive = true

[weather]
unit = "celsius"

[widget.bar]
type = "noctalia/timer:bar"

[widget.cat]
scale = 1.4000000000000001
type = "dotnetrob/cat:cat"

[widget.cat_2]
scale = 1.75
type = "dotnetrob/cat:cat"

[widget.cat_4]
audio_spectrum = true
scale = 1.75
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
capsule = true
capsule_padding = 10
color = "primary"
font_weight = 700
format = "{:%A, %d %B - %H:%M}"
scale = 1.1
vertical_format = "{:%H  %M}"

[widget.cpu]
glyph = "cpu"
show_value = false

[widget.gpu-temp]
show_glyph = false
stat = "gpu_temp"
type = "sysmon"

[widget.gpu-vram]
show_glyph = false
show_value = false
stat = "gpu_vram_used"
type = "sysmon"

[widget.media]
capsule = true

[widget.network]
show_label = false
show_vpn_label = true
vpn_status = "both"

[widget.pill]
capsule = true
capsule_opacity = 0.5
pill_style = "ring"
ring_thickness = 4
type = "jrohland/claudecode:pill"

[widget.portage]
capsule = true
color = "primary"
type = "jkyon/portage-updates:widget"

[widget.ram]
glyph = "ticket"
show_value = false

[widget.session]
anchor = true
capsule = true
capsule_padding = 5
color = "primary"
scale = 1.1

[widget.spacer_media]
length = 33
type = "spacer"

[widget.spacer_power]
interactive = true
type = "spacer"

[widget.status]
enabled = true
type = "icefish/phone-operate:status"

[widget.status_2]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.summary]
type = "gustav0ar/drive-health:summary"

[widget.swap]
show_glyph = false
show_value = false
stat = "swap_pct"
type = "sysmon"

[widget.sysmon]
glyph = "brand-graphql"
show_value = false

[widget.temp]
show_glyph = false

[widget.volume]
show_label = false

[widget.weather]
anchor = true

[widget.workspaces]
active_pill_size = 2.0
anchor = true
change_color_on_hover = true
empty_color = "outline_variant"
label_source = "name"
labels_only_when_occupied = true
scale = 1.25
show_labels = false
