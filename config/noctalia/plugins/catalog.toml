[[plugin]]
id = "jkyon/portage-updates"
name = "Portage Updates"
version = "1.0.0"
author = "jkyon"
license = "MIT"
icon = "download"
description = "Mostra o número de pacotes disponíveis para atualização no Portage (Gentoo), lendo o cache gerado pelos timers systemd de sincronização."
plugin_api = 9
tags = [ "gentoo", "portage", "system" ]

[[plugin]]
id = "jkyon/hw-alerts"
name = "Hardware Alerts"
version = "1.0.0"
author = "jkyon"
license = "MIT"
icon = "alert-triangle"
description = "Sem widget: avisa com notificação crítica (fica até ser fechada) quando temperatura de CPU/GPU, RAM, swap ou VRAM passam do limite, lendo o system monitor do próprio Noctalia."
plugin_api = 12
tags = [ "service", "system", "hardware" ]
