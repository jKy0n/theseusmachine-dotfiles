# Noctalia v5 — TheseusMachine
# Config mínimo: só o que difere do padrão (gerado por poda via `noctalia config export full`).
# Camadas: este arquivo (~/.config/noctalia/config.toml) → depois ~/.local/state/noctalia/settings.toml (GUI, local).
# Mudou algo pela GUI e quer manter? `noctalia config export merged` e traga o trecho pra cá.
# [location] fica no settings.toml local de propósito (repo público).

[audio]
sound_volume = 0.669999985024333

[backdrop]
enabled = true

[bar.main]
center = ["group:g2", "group:g1", "spacer_media", "group:g4", "spacer_media", "portage"]
end = ["cat", "group:g3", "pill", "spacer_power", "session"]
margin_edge = 5
margin_ends = 10
padding = 20
position = "right"
start = ["workspaces", "spacer_media", "media"]
thickness = 40

[bar.main.monitor.HDMI-A-1]
center = ["group:g1", "spacer_media", "clock"]
end = ["media", "spacer_media", "session"]
position = "top"
start = ["workspaces"]

[[bar.main.monitor.HDMI-A-1.capsule_group]]
id = "g1"
members = ["cat_4", "cat_2"]
opacity = 0.0
padding = 8.0

[[bar.main.capsule_group]]
id = "g1"
members = ["tray"]

[[bar.main.capsule_group]]
id = "g2"
members = ["status", "bar", "clipboard", "caffeine", "volume", "notifications", "network", "status_2"]

[[bar.main.capsule_group]]
id = "g3"
members = ["cpu", "temp", "sysmon", "gpu-vram", "gpu-temp", "ram", "swap", "summary"]

[[bar.main.capsule_group]]
id = "g4"
members = ["clock", "weather"]

[brightness]
enable_ddcutil = true
minimum_brightness = 0.09999999776482582
sync_all_monitors = true

[calendar]
enabled = true

[calendar.account.personal]
name = "agenda"
type = "google"

[control_center]
hidden_tabs = ["power"]
sidebar = "full"
sidebar_section = "full"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "notification"

[dock]
margin_edge = 8

[idle]
behavior_order = ["lock", "screen-off", "idle-behavior"]
pre_action_fade_seconds = 10

[idle.behavior.idle-behavior]
